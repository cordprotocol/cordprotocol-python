[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cordprotocol"
version = "0.3.0"
description = "Post-quantum cryptographic identity for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Cord Protocol", email = "hello@cordprotocol.dev" },
]
keywords = [
    "ai",
    "agents",
    "cryptography",
    "identity",
    "post-quantum",
    "langchain",
    "crewai",
    "autogen",
    "did", 
    "verifiable-credentials", 
    "w3c", 
    "mcp", 
    "agentic", 
    "security", 
    "jwt"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
]

[project.scripts]
cord = "cordprotocol.cli:main"

[project.urls]
Homepage      = "https://cordprotocol.dev"
Repository    = "https://github.com/cordprotocol/cordprotocol-python"
Documentation = "https://cordprotocol.dev/docs/python"
"Bug Tracker" = "https://github.com/cordprotocol/cordprotocol-python/issues"
"npm Package" = "https://www.npmjs.com/package/@cordprotocol/sdk"

[tool.hatch.build.targets.wheel]
packages = ["cordprotocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
